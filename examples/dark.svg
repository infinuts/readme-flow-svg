<svg xmlns="http://www.w3.org/2000/svg" width="680" height="204" viewBox="0 0 680 204" role="img" aria-labelledby="title desc"><title id="title">Upload → Validate → Compress → Download</title><desc id="desc">An animated file processing workflow with 4 steps.</desc><style>text{font-family:-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif}.stage,.traveler{animation-duration:6s;animation-timing-function:linear;animation-iteration-count:infinite;animation-play-state:running}.traveler{animation-name:travel}@keyframes travel{0.000%,9.500%{transform:translateX(0px)}25.000%,34.500%{transform:translateX(172px)}50.000%,59.500%{transform:translateX(344px)}75.000%,84.500%{transform:translateX(516px)}100%{transform:translateX(516px)}}@media(prefers-reduced-motion:reduce){.stage,.traveler{animation:none}}</style><rect width="680" height="204" rx="16" fill="#151c20"/><path d="M82 156H598" stroke="#34464e" stroke-width="1.5"/><path d="M146 91h43m-5-4 5 4-5 4" stroke="#34464e" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M318 91h43m-5-4 5 4-5 4" stroke="#34464e" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M490 91h43m-5-4 5 4-5 4" stroke="#34464e" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><style>@keyframes stage0{0%,24.990%{fill:#223e32;stroke:#62d39b}25.000%,100%{fill:#1e292f;stroke:#34464e}}</style><g><rect class="stage" style="animation-name:stage0" x="23" y="43" width="118" height="95" rx="12" fill="#1e292f" stroke="#34464e"/><text x="37" y="62" fill="#8caaa0" font-size="9">01</text><g transform="translate(70 65)" fill="none" stroke="#62d39b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4m-4 4 4-4 4 4M4 16v4h16v-4"/></g><text x="82" y="116" fill="#e1ebe6" text-anchor="middle" font-size="12" font-weight="500">Upload</text><circle cx="82" cy="156" r="3" fill="#34464e"/></g><style>@keyframes stage1{0%,24.990%,50.000%,1