name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: need
    attributes:
      label: What are you trying to do?
      description: Explain the workflow and where the current tool gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Suggested change
      description: Include alternatives or a small example if useful.
