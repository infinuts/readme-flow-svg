name: Update README showcase
on:
  push:
    branches: [main]
    paths:
      - community/repos.json
      - scripts/sync-showcase.mjs
      - src/community.js
      - .github/workflows/showcase.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: readme-showcase
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/sync-showcase.mjs
      - name: Commit updated repository list
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README community showcase"
          git push origin HEAD:main
